  // Break-even trades are real money (still counted in P&L above) but are
  // excluded from win rate / expectancy everywhere -- they didn't clearly
  // win or lose, so counting them either way would understate the win rate.
  const winRateEligible = tradingOnly.filter((t) => !t.breakEven);
  const wins = winRateEligible.filter((t) => t.pnl > 0).length;
  const losses = winRateEligible.filter((t) => t.pnl < 0).length;
  const winRate = winRateEligible.length ? Math.round((wins / winRateEligible.length) * 100) : 0;
  const avgDuration = tradingOnly.length ? Math.round(tradingOnly.reduce((s, t) => s + t.duration, 0) / tradingOnly.length) : 0;
  const grossWin = tradingOnly.filter(t => t.pnl > 0).reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(tradingOnly.filter(t => t.pnl < 0).reduce((s,t)=>s+t.pnl,0));
  const profitFactor = grossLoss > 0 ? (grossWin / grossLoss) : (grossWin > 0 ? Infinity : 0);
  const tradesWithRR = tradingOnly.filter((t) => t.rr !== null && t.rr !== undefined && !Number.isNaN(t.rr));
  const avgRR = tradesWithRR.length ? tradesWithRR.reduce((s, t) => s + t.rr, 0) / tradesWithRR.length : null;

  const moodInfo = (key) => MOODS.find((m) => m.key === key) || MOODS[MOODS.length - 1];

  // Payouts don't consume a trade number — only real trades count, so the
  // sequence stays consecutive across any payouts logged in between.
  const tradeNumberMap = new Map(
    [...trades]
      .filter((t) => t.entryType !== "payout")
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)))
      .map((t, i) => [t.id, i + 1])
  );

  const linkableTrades = [...trades].sort((a, b) => (a.date < b.date ? 1 : -1));
  const allMediaItems = trades
    .filter((t) => t.entryType !== "payout")
    .flatMap((t) => (t.media || []).map((m) => ({ media: m, trade: t, number: tradeNumberMap.get(t.id) })))
    .sort((a, b) => (b.number || 0) - (a.number || 0));
  function tradeLabel(t) {
    return `#${tradeNumberMap.get(t.id)} · ${t.date} · ${t.symbol || "—"} · ${fmtMoney(t.pnl)}`;
  }
  function findTrade(id) {
    return trades.find((t) => t.id === id) || null;
  }

  const patternStats = Object.values(
    entries.reduce((acc, en) => {
      if (!en.tradeId) return acc;
      const t = findTrade(en.tradeId);
      if (!t) return acc;
      const key = en.mood || "flat";
      if (!acc[key]) {
        const mi = MOODS.find((m) => m.key === key) || MOODS[MOODS.length - 1];
        acc[key] = { moodKey: key, label: mi.label, color: mi.color, count: 0, total: 0, wins: 0, durationSum: 0, trades: [] };
      }
      acc[key].count += 1; acc[key].total += t.pnl;
      if (t.pnl > 0) acc[key].wins += 1;
      acc[key].durationSum += t.duration;
      acc[key].trades.push(t);
      return acc;
    }, {})
  ).map((p) => ({
    ...p,
    winRate: Math.round((p.wins / p.count) * 100),
    avg: p.total / p.count,
    avgDuration: Math.round(p.durationSum / p.count),
    trades: [...p.trades].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)),
  }))
   .sort((a, b) => b.total - a.total);

  const bestPattern = patternStats[0];
  const worstPattern = patternStats[patternStats.length - 1];

  const confluenceNameById = Object.fromEntries(confluencesList.map((c) => [c.id, c.name]));
  const targetTagNameById = Object.fromEntries(targetTagsList.map((t) => [t.id, t.name]));

  function buildIdMap(links, keyField, valueField) {
    const map = {};
    links.forEach((l) => {
      if (!map[l[keyField]]) map[l[keyField]] = [];
      map[l[keyField]].push(l[valueField]);
    });
    Object.keys(map).forEach((k) => { map[k] = Array.from(new Set(map[k])).sort(); });
    return map;
  }
  // Trades can carry the same confluence twice (different timeframes) — for
  // pattern matching, what matters is which confluences/targets were
  // present, not how many times each was tagged, so dedupe before comparing.
  const tradeConfluenceMap = buildIdMap(tradeConfluenceLinks, "trade_id", "confluence_id");
  const tradeTargetTagMap = buildIdMap(tradeTargetTagLinks, "trade_id", "target_tag_id");
  const patternConfluenceMap = buildIdMap(patternConfluenceLinks, "pattern_id", "confluence_id");
  const patternTargetTagMap = buildIdMap(patternTargetTagLinks, "pattern_id", "target_tag_id");
  function sameIds(a, b) {
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  // A stable "Pattern N" number per pattern, assigned by creation order —
  // independent of whatever order patternPerf currently displays in (which
  // re-sorts by win rate), so a pattern's default name never changes.
  const patternNumberMap = new Map(
    [...patternsList]
      .sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : (a.id < b.id ? -1 : 1)))
      .map((p, i) => [p.id, i + 1])
  );
  const patternPerf = patternsList
    // A pattern with zero linked confluences AND zero linked target tags is
    // a "naked" leftover from a failed insert, not a real pattern — never
    // show it or match trades to it. A pattern built from only one of the
    // two (e.g. target tags with no confluences) is legitimate.
    .filter((p) => (patternConfluenceMap[p.id] || []).length > 0 || (patternTargetTagMap[p.id] || []).length > 0)
    .map((p) => {
      const confIds = patternConfluenceMap[p.id] || [];
      const tagIds = patternTargetTagMap[p.id] || [];
      const confLabel = confIds.map((id) => confluenceNameById[id] || "?").join(" + ");
      const tagLabel = tagIds.map((id) => targetTagNameById[id] || "?").join(" + ");
      const label = confLabel && tagLabel ? `${confLabel} · ${tagLabel}` : (confLabel || tagLabel);
      const taggedTrades = tradingOnly.filter((t) =>
        sameIds(tradeConfluenceMap[t.id] || [], confIds) && sameIds(tradeTargetTagMap[t.id] || [], tagIds)
      );
      const count = taggedTrades.length;
      // Break-even trades still count toward frequency (count) above, but
      // are excluded from every performance number below -- they didn't
      // clearly win or lose, so they shouldn't dilute win rate, expectancy,
      // or this pattern's P&L.
      const scoredTrades = taggedTrades.filter((t) => !t.breakEven);
      const scoredCount = scoredTrades.length;
      const total = scoredTrades.reduce((s, t) => s + t.pnl, 0);
      const winningTrades = scoredTrades.filter((t) => t.pnl > 0);
      const losingTrades = scoredTrades.filter((t) => t.pnl < 0);
      const wins = winningTrades.length;
      const winRateP = scoredCount ? Math.round((wins / scoredCount) * 100) : 0;
      // Biggest win/loss only ever come from an actual winning/losing trade —
      // if there are none of one kind (e.g. every trade in this pattern won),
      // that figure is 0, not the closest-to-zero trade of the other kind.
      const biggestWin = winningTrades.length ? Math.max(...winningTrades.map((t) => t.pnl)) : 0;
      const biggestLoss = losingTrades.length ? Math.min(...losingTrades.map((t) => t.pnl)) : 0;
      // Expectancy: the average $ result you'd expect per trade of this
      // pattern, given its actual win rate and its actual average win/loss
      // size — a truer measure of edge than win rate alone, since a pattern
      // can win often but still lose money if losses run bigger than wins.
      const avgWin = winningTrades.length ? winningTrades.reduce((s, t) => s + t.pnl, 0) / winningTrades.length : 0;
      const avgLoss = losingTrades.length ? Math.abs(losingTrades.reduce((s, t) => s + t.pnl, 0) / losingTrades.length) : 0;
      const winRateDec = scoredCount ? wins / scoredCount : 0;
      const lossRateDec = scoredCount ? losingTrades.length / scoredCount : 0;
      const expectancy = winRateDec * avgWin - lossRateDec * avgLoss;
      const ruledTrades = taggedTrades.filter((t) => t.rulesFollowed === true || t.rulesFollowed === false);
      const adherenceRate = ruledTrades.length ? Math.round((ruledTrades.filter((t) => t.rulesFollowed === true).length / ruledTrades.length) * 100) : null;
      const sortedTrades = [...taggedTrades].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
      return { id: p.id, name: p.name || null, number: patternNumberMap.get(p.id), label, confLabel, tagLabel, grade: p.grade, count, total, winRateP, biggestWin, biggestLoss, expectancy, adherenceRate, trades: sortedTrades };
    })
    // Never show (or let stats/naming attach to) a pattern with no trades
    // actually matching its exact combination — e.g. one left behind after
    // every trade that had it was edited to remove the tag, or a payout
    // (which never counts toward pattern stats) was tagged with it.
    .filter((p) => p.count > 0);
  const patternSortComparators = {
    number: (a, b) => a.number - b.number,
    pnl: (a, b) => b.total - a.total,
    winRate: (a, b) => b.winRateP - a.winRateP,
    frequency: (a, b) => b.count - a.count,
    expectancy: (a, b) => b.expectancy - a.expectancy,
  };
  const sortedPatternPerf = [...patternPerf].sort(patternSortComparators[patternSortBy] || patternSortComparators.winRate);
  const bestConfluencePattern = patternPerf.length
    ? [...patternPerf].sort((a, b) => b.total - a.total)[0]
    : null;

  // ---- Weekly review digest: always the CURRENT Mon–Sun week, recomputed
  // from live trade data on every render — there's nothing to "generate",
  // it just reflects whatever's true right now. ----
  const weekDigest = (() => {
    const today = new Date();
    const dow = today.getDay(); // 0 = Sun
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() + mondayOffset);
    weekStart.setHours(0, 0, 0, 0);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const fmtISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const startStr = fmtISO(weekStart);
    const endStr = fmtISO(weekEnd);
    const weekTrades = tradingOnly.filter((t) => t.date >= startStr && t.date <= endStr);
    const count = weekTrades.length;
    const total = weekTrades.reduce((s, t) => s + t.pnl, 0);
    const weekScored = weekTrades.filter((t) => !t.breakEven);
    const wins = weekScored.filter((t) => t.pnl > 0).length;
    const winRateWk = weekScored.length ? Math.round((wins / weekScored.length) * 100) : 0;
    const best = weekTrades.length ? weekTrades.reduce((a, t) => (t.pnl > a.pnl ? t : a)) : null;
    const worst = weekTrades.length ? weekTrades.reduce((a, t) => (t.pnl < a.pnl ? t : a)) : null;
    const ruled = weekTrades.filter((t) => t.rulesFollowed === true || t.rulesFollowed === false);
    const adherence = ruled.length ? Math.round((ruled.filter((t) => t.rulesFollowed === true).length / ruled.length) * 100) : null;
    const fmtShort = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const rangeLabel = `${fmtShort(weekStart)} – ${fmtShort(weekEnd)}`;
    return { rangeLabel, count, total, winRateWk, best, worst, adherence };
  })();

  // ---- Calendar: group trades by date, build week rows with a trailing Total column ----
  const dayMap = trades.reduce((acc, t) => {
    if (!acc[t.date]) acc[t.date] = { total: 0, count: 0, wins: 0, scoredCount: 0, payoutTotal: 0, hasBreakEven: false };
    if (t.entryType === "payout") {
      acc[t.date].payoutTotal += t.pnl;
    } else {
      acc[t.date].total += t.pnl;
      acc[t.date].count += 1;
      if (t.breakEven) {
        acc[t.date].hasBreakEven = true;
      } else {
        acc[t.date].scoredCount += 1;
        if (t.pnl > 0) acc[t.date].wins += 1;
      }
    }
    return acc;
  }, {});
  // Daily loss limit is PER ACCOUNT, but a trade's stored pnl is already the
  // combined total across accountCount accounts (see accountsMultiplier in
  // addTrade) — divide back down before comparing.
  const dailyLossLimitNum = targets.dailyLossLimit === "" || targets.dailyLossLimit === null || targets.dailyLossLimit === undefined
    ? null : Number(targets.dailyLossLimit);
  if (dailyLossLimitNum !== null && !Number.isNaN(dailyLossLimitNum)) {
    const perAccountDivisor = accountCount || 1;
    Object.values(dayMap).forEach((d) => {
      d.dllHit = (d.total / perAccountDivisor) <= -Math.abs(dailyLossLimitNum);
    });
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function buildCalendarWeeks(dayMapArg, year, month) {
    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startWeekday = firstOfMonth.getDay(); // 0 = Sun
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
      cells.push({ day: d, dateStr, data: dayMapArg[dateStr] || null });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) {
      const weekCells = cells.slice(i, i + 7);
      const weekTotal = weekCells.reduce((s, c) => s + (c && c.data ? c.data.total : 0), 0);
      const weekPayoutTotal = weekCells.reduce((s, c) => s + (c && c.data ? c.data.payoutTotal : 0), 0);
      const weekTradeCount = weekCells.reduce((s, c) => s + (c && c.data ? c.data.count : 0), 0);
      weeks.push({ cells: weekCells, total: weekTotal, payoutTotal: weekPayoutTotal, tradeCount: weekTradeCount });
    }
    return weeks;
  }
  const calendarWeeks = buildCalendarWeeks(dayMap, calYear, calMonth);
  const firstEntryDate = trades.length ? [...trades].sort((a, b) => (a.date < b.date ? -1 : 1))[0].date : null;
  const firstEntryYear = firstEntryDate ? Number(firstEntryDate.slice(0, 4)) : null;
  const firstEntryMonth = firstEntryDate ? Number(firstEntryDate.slice(5, 7)) - 1 : null;
  const atEarliestMonth = firstEntryDate !== null && (calYear < firstEntryYear || (calYear === firstEntryYear && calMonth <= firstEntryMonth));
  const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const WEEKDAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri"];

  // ---- Account size: running balance starting at 0, one point per calendar day (evenly spaced) ----
  function nextDay(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function prevDay(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function applyQuickRange(preset) {
    setQuickRange(preset);
    if (!preset) return;
    const end = new Date();
    const start = new Date();
    if (preset === "1d") start.setDate(end.getDate() - 1);
    else if (preset === "1w") start.setDate(end.getDate() - 7);
    else if (preset === "2w") start.setDate(end.getDate() - 14);
    else if (preset === "1m") start.setMonth(end.getMonth() - 1);
    else if (preset === "6m") start.setMonth(end.getMonth() - 6);
    else if (preset === "1y") start.setFullYear(end.getFullYear() - 1);
    const fmtLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    setPerfRangeStart(fmtLocal(start));
    setPerfRangeEnd(fmtLocal(end));
  }
  const chronoTradesAll = [...trades].sort((a, b) => (a.date > b.date ? 1 : a.date < b.date ? -1 : 0));
  const chronoTrades = chronoTradesAll.filter((t) => {
    if (perfRangeStart && t.date < perfRangeStart) return false;
    if (perfRangeEnd && t.date > perfRangeEnd) return false;
    return true;
  });
  const dayStart = perfRangeStart || (chronoTrades[0] ? chronoTrades[0].date : null);
  const dayEnd = perfRangeEnd || (chronoTrades.length ? chronoTrades[chronoTrades.length - 1].date : null);
  const maxLossNumForCurve = targets.maxLoss === "" ? null : Number(targets.maxLoss);
  function isWeekend(dateStr) {
    const wd = new Date(dateStr + "T00:00:00").getDay();
    return wd === 0 || wd === 6;
  }
  const equityCurve = [];
  if (dayStart && dayEnd) {
    const dayPnl = {};
    const dayPayout = {};
    chronoTrades.forEach((t) => {
      dayPnl[t.date] = (dayPnl[t.date] || 0) + t.pnl;
      if (t.entryType === "payout") dayPayout[t.date] = (dayPayout[t.date] || 0) + t.pnl;
    });
    equityCurve.push({ date: prevDay(dayStart), balance: 0, minBalance: null, payoutTotal: 0 });
    let running = 0;
    let peakToDate = 0;
    let cur = dayStart;
    let guard = 0;
    while (cur <= dayEnd && guard < 5000) {
      running += dayPnl[cur] || 0;
      peakToDate = Math.max(peakToDate, running);
      if (!isWeekend(cur) || dayPnl[cur] !== undefined) {
        const minBalance = maxLossNumForCurve !== null ? peakToDate - Math.abs(maxLossNumForCurve) : null;
        equityCurve.push({ date: cur, balance: running, minBalance, payoutTotal: dayPayout[cur] || 0 });
      }
      if (cur === dayEnd) break;
      cur = nextDay(cur);
      guard++;
    }
  }
  const currentBalance = equityCurve.length ? equityCurve[equityCurve.length - 1].balance : 0;
  const peakBalance = Math.max(0, ...equityCurve.map((p) => p.balance));

  // ---- Trading Insights (Performance tab) ----
  const WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const weekdayStats = (() => {
    const byDay = {};
    tradingOnly.forEach((t) => {
      const wd = new Date(t.date + "T00:00:00").getDay();
      if (!byDay[wd]) byDay[wd] = { dates: new Set(), count: 0, total: 0 };
      byDay[wd].dates.add(t.date);
      byDay[wd].count += 1;
      byDay[wd].total += t.pnl;
    });
    return Object.entries(byDay).map(([wd, d]) => ({
      label: WEEKDAY_NAMES[Number(wd)],
      avgTrades: d.count / d.dates.size,
      avgPnl: d.total / d.dates.size,
    }));
  })();
  const mostActiveDay = weekdayStats.length ? [...weekdayStats].sort((a, b) => b.avgTrades - a.avgTrades)[0] : null;
  const mostProfitableDay = weekdayStats.length ? [...weekdayStats].sort((a, b) => b.avgPnl - a.avgPnl)[0] : null;
  const leastProfitableDay = weekdayStats.length ? [...weekdayStats].sort((a, b) => a.avgPnl - b.avgPnl)[0] : null;

  const shortCount = tradingOnly.filter((t) => t.side === "short").length;
  const longCount = tradingOnly.length - shortCount;
  const dominantDirection = tradingOnly.length === 0 ? null : (shortCount > longCount ? "Short" : "Long");

  // Drawdown should reflect actual trading performance, not withdrawals —
  // a payout would otherwise show up as a fake "loss" dip. Recompute a
  // trading-only running balance over the same dates as equityCurve (whose
  // first point is a synthetic "day before start" placeholder at 0).
  const drawdownCurve = (() => {
    const dayPnlTradingOnly = {};
    chronoTrades.forEach((t) => {
      if (t.entryType !== "payout") dayPnlTradingOnly[t.date] = (dayPnlTradingOnly[t.date] || 0) + t.pnl;
    });
    let running = 0;
    let peak = 0;
    return equityCurve.map((p, i) => {
      if (i > 0) running += dayPnlTradingOnly[p.date] || 0;
      peak = Math.max(peak, running);
      return { date: p.date, value: running - peak };
    });
  })();

  const winningTradesAll = tradingOnly.filter((t) => t.pnl > 0);
  const losingTradesAll = tradingOnly.filter((t) => t.pnl < 0);
  const avgWinAll = winningTradesAll.length ? winningTradesAll.reduce((s, t) => s + t.pnl, 0) / winningTradesAll.length : 0;
  const avgLossAll = losingTradesAll.length ? losingTradesAll.reduce((s, t) => s + t.pnl, 0) / losingTradesAll.length : 0;

  const DURATION_BUCKETS = [
    { label: "under 15s", min: 0, max: 15 },
    { label: "15 to 45s", min: 15, max: 45 },
    { label: "45s to 1min", min: 45, max: 60 },
    { label: "1min to 2min", min: 60, max: 120 },
    { label: "2min to 5min", min: 120, max: 300 },
    { label: "5min to 10min", min: 300, max: 600 },
    { label: "10min to 30min", min: 600, max: 1800 },
    { label: "30min to 1hr", min: 1800, max: 3600 },
    { label: "1hr to 4hr", min: 3600, max: 14400 },
    { label: "more than 4hr", min: 14400, max: Infinity },
  ];
  const durationBucketStats = DURATION_BUCKETS.map((b) => {
    const inBucket = tradingOnly.filter((t) => t.duration >= b.min && t.duration < b.max);
    const bucketScored = inBucket.filter((t) => !t.breakEven);
    const wins = bucketScored.filter((t) => t.pnl > 0).length;
    return {
      label: b.label,
      count: inBucket.length,
      pctOfTrades: tradingOnly.length ? (inBucket.length / tradingOnly.length) * 100 : 0,
      winRate: bucketScored.length ? (wins / bucketScored.length) * 100 : 0,
      avgNetPnl: inBucket.length ? inBucket.reduce((s, t) => s + t.pnl, 0) / inBucket.length : 0,
    };
  });

  // ---- Insights: a small rules engine over live trade/pattern/journal data.
  // Recomputed fresh on every render (nothing is stored or "generated" once)
  // so it always reflects whatever's been logged up to this second — add or
  // edit a trade, tag a pattern, or write a journal entry, and this list
  // updates right along with it.
  const insights = (() => {
    const list = []; // { id, tone: 'bad' | 'good' | 'tip', title, body, weight }
    const MIN_SAMPLE = 3;

    // Rule adherence: does actually following the plan pay off?
    const ruledTrades = tradingOnly.filter((t) => t.rulesFollowed === true || t.rulesFollowed === false);
    const followed = ruledTrades.filter((t) => t.rulesFollowed === true);
    const broke = ruledTrades.filter((t) => t.rulesFollowed === false);
    if (followed.length >= MIN_SAMPLE && broke.length >= MIN_SAMPLE) {
      const avgFollowed = followed.reduce((s, t) => s + t.pnl, 0) / followed.length;
      const avgBroke = broke.reduce((s, t) => s + t.pnl, 0) / broke.length;
      const gap = avgFollowed - avgBroke;
      if (gap > 0) {
        const drag = gap * broke.length;
        list.push({
          id: "rules-gap", tone: "bad", weight: Math.abs(drag),
          title: "Breaking your own rules is costing you",
          body: `On the ${followed.length} trades where you followed your plan you averaged ${fmtMoney(avgFollowed)}; on the ${broke.length} where you didn't, ${fmtMoney(avgBroke)}. That gap has cost you roughly ${fmtMoney(drag)} across your off-plan trades — the single highest-leverage fix available right now is simply not taking the trade when it breaks your rules.`,
        });
      } else {
        list.push({
          id: "rules-gap-ok", tone: "good", weight: 20,
          title: "Your rules aren't the bottleneck",
          body: `Trades where you broke your rules (${fmtMoney(avgBroke)} avg) did no worse than the ones where you followed them (${fmtMoney(avgFollowed)} avg) — so if something's holding back your results, it's more likely setup selection or sizing than discipline.`,
        });
      }
    }

    // Best / worst pattern by expectancy — a truer measure of edge than win rate alone.
    const scoredPatterns = patternPerf.filter((p) => p.count >= MIN_SAMPLE);
    if (scoredPatterns.length) {
      const worst = [...scoredPatterns].sort((a, b) => a.expectancy - b.expectancy)[0];
      const best = [...scoredPatterns].sort((a, b) => b.expectancy - a.expectancy)[0];
      if (worst.expectancy < 0) {
        const drag = worst.expectancy * worst.count;
        list.push({
          id: `pattern-worst-${worst.id}`, tone: "bad", weight: Math.abs(drag),
          title: `"${worst.name || worst.label}" is a net negative`,
          body: `Across ${worst.count} trades this pattern has an expectancy of ${fmtMoney(worst.expectancy)} per trade (${worst.winRateP}% win rate) — roughly ${fmtMoney(Math.abs(drag))} lost to it overall. Unless it's been mis-tagged, consider cutting it from your rules entirely.`,
        });
      }
      if (best.expectancy > 0 && best.id !== worst.id) {
        list.push({
          id: `pattern-best-${best.id}`, tone: "good", weight: best.expectancy * best.count * 0.6,
          title: `"${best.name || best.label}" is your strongest edge`,
          body: `${best.count} trades, ${best.winRateP}% win rate, and an expectancy of +${fmtMoney(best.expectancy)} per trade. This is the setup to size up on and actively look for — everything else is competing with this for your attention.`,
        });
      }
    }

    // Duration sweet spot / danger zone.
    const scoredDurations = durationBucketStats.filter((b) => b.count >= MIN_SAMPLE);
    if (scoredDurations.length) {
      const worstDur = [...scoredDurations].sort((a, b) => a.avgNetPnl - b.avgNetPnl)[0];
      const bestDur = [...scoredDurations].sort((a, b) => b.avgNetPnl - a.avgNetPnl)[0];
      if (worstDur.avgNetPnl < 0 && worstDur.label !== bestDur.label) {
        list.push({
          id: "duration-worst", tone: "bad", weight: Math.abs(worstDur.avgNetPnl) * worstDur.count * 0.5,
          title: `Trades held ${worstDur.label} are dragging you down`,
          body: `${worstDur.count} trades in this duration band average ${fmtMoney(worstDur.avgNetPnl)}, versus ${fmtMoney(bestDur.avgNetPnl)} for trades held ${bestDur.label}. Watch what's different about how you manage a trade once it crosses into this window — it's often either overstaying a loser or cutting a winner short from boredom.`,
        });
      }
    }

    // Day-of-week weakness.
    if (mostProfitableDay && leastProfitableDay && mostProfitableDay.label !== leastProfitableDay.label && leastProfitableDay.avgPnl < 0) {
      list.push({
        id: "weekday-weak", tone: "bad", weight: Math.abs(leastProfitableDay.avgPnl) * 8,
        title: `${leastProfitableDay.label}s are your weakest day`,
        body: `You average ${fmtMoney(leastProfitableDay.avgPnl)} per day trading on ${leastProfitableDay.label}s, against ${fmtMoney(mostProfitableDay.avgPnl)} on ${mostProfitableDay.label}s. If that holds up over more data, trading smaller (or not at all) on ${leastProfitableDay.label}s is a low-effort way to raise your average.`,
      });
    }

    // R:R vs win rate math check.
    if (avgRR !== null && avgRR > 0 && tradingOnly.length >= 5) {
      const breakevenWinRate = (1 / (1 + avgRR)) * 100;
      if (winRate < breakevenWinRate - 5) {
        list.push({
          id: "rr-math", tone: "bad", weight: (breakevenWinRate - winRate) * 3,
          title: "Your win rate doesn't support your R:R",
          body: `At an average R:R of ${avgRR.toFixed(2)}, you need roughly a ${Math.round(breakevenWinRate)}% win rate just to break even — you're at ${winRate}%. Either tighten entries to raise the win rate, or let winners run further to raise the average R:R; right now the math is working against you.`,
        });
      }
    }

    // Position sizing consistency.
    const riskedTrades = tradingOnly.filter((t) => t.risk !== null && t.risk !== undefined && t.risk > 0);
    if (riskedTrades.length >= 5) {
      const risks = riskedTrades.map((t) => t.risk);
      const minRisk = Math.min(...risks), maxRisk = Math.max(...risks);
      if (maxRisk > minRisk * 3 && maxRisk - minRisk > 0.5) {
        list.push({
          id: "risk-consistency", tone: "tip", weight: 15,
          title: "Your position sizing swings a lot",
          body: `Risk per trade has ranged from ${minRisk}% to ${maxRisk}% with no clear pattern. Wide, ad-hoc sizing makes it hard to tell whether a run of results came from your edge or from how big you happened to size that trade — picking a standard risk per setup type would make your stats easier to trust.`,
        });
      }
    }

    // Mood correlation, from journal entries linked to trades.
    const scoredMoods = patternStats.filter((p) => p.count >= MIN_SAMPLE);
    if (scoredMoods.length >= 2) {
      const worstMood = [...scoredMoods].sort((a, b) => a.avg - b.avg)[0];
      const bestMood = [...scoredMoods].sort((a, b) => b.avg - a.avg)[0];
      if (worstMood.avg < 0 && worstMood.label !== bestMood.label) {
        list.push({
          id: "mood-worst", tone: "bad", weight: Math.abs(worstMood.avg) * worstMood.count * 0.4,
          title: `Trades logged as feeling "${worstMood.label}" underperform`,
          body: `${worstMood.count} trades linked to a "${worstMood.label}" journal entry average ${fmtMoney(worstMood.avg)}, versus ${fmtMoney(bestMood.avg)} when you logged "${bestMood.label}". That feeling is worth treating as a warning sign to slow down or step away before you enter, not just a note after the fact.`,
        });
      }
    }

    // Journal coverage — encourages the input this whole feature depends on.
    const linkedTradeCount = new Set(entries.filter((en) => en.tradeId).map((en) => en.tradeId)).size;
    if (tradingOnly.length >= 8 && linkedTradeCount / tradingOnly.length < 0.3) {
      list.push({
        id: "journal-coverage", tone: "tip", weight: 10,
        title: "Journal more trades to sharpen these insights",
        body: `Only ${linkedTradeCount} of your ${tradingOnly.length} trades have a linked journal entry. Mood-based insights — like which emotional states correlate with your best and worst trades — get more reliable the more trades you log a feeling for, even a one-line entry.`,
      });
    }

    return list.sort((a, b) => b.weight - a.weight);
  })();

  // whether the AI journal-text analysis (below) needs to re-run. Changes
  // whenever a texty entry is added, edited, or removed; stays put on a
  // plain re-render or tab switch, so that pass only ever re-runs (and
  // re-costs) when there's actually something new to read.
  const journalFingerprint = entries
    .filter((en) => ((en.notes || "") + (en.feelingDetail || "") + (en.conditions || "")).trim().length >= 15)
    .map((en) => `${en.id}:${en.notes || ""}|${en.feelingDetail || ""}|${en.conditions || ""}`)

  // content has changed since the last analysis, so it never re-runs (and
  // re-costs) on unchanged data.
  async function fetchJournalInsights(fingerprintToCache) {
    setJournalInsightsLoading(true);
    setJournalInsightsError(null);
    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/journal-insights", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Could not analyze journal entries.");
      const runAt = Date.now();
      setJournalInsights(body.insights || []);
      setJournalInsightsRunAt(runAt);
      try {
        localStorage.setItem(`aiInsightsFp:${userId}`, fingerprintToCache || "");
        localStorage.setItem(`aiInsightsCache:${userId}`, JSON.stringify({ insights: body.insights || [], runAt }));
      } catch (e) { /* localStorage unavailable — cache just won't persist across reloads */ }
    } catch (err) {
      setJournalInsightsError(err.message || "Could not analyze journal entries.");
    } finally {
      setJournalInsightsLoading(false);
    }
  }

      {viewingFriend && (() => {
        const tradingOnlyF = friendTrades.filter((t) => t.entryType !== "payout");
        const totalPnlF = tradingOnlyF.reduce((s, t) => s + t.pnl, 0);
        const winsF = tradingOnlyF.filter((t) => t.pnl > 0).length;
        const winRateF = tradingOnlyF.length ? Math.round((winsF / tradingOnlyF.length) * 100) : 0;
        const grossWinF = tradingOnlyF.filter((t) => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
        const grossLossF = Math.abs(tradingOnlyF.filter((t) => t.pnl < 0).reduce((s, t) => s + t.pnl, 0));
        const profitFactorF = grossLossF > 0 ? (grossWinF / grossLossF) : (grossWinF > 0 ? Infinity : 0);
        const avgDurationF = tradingOnlyF.length ? Math.round(tradingOnlyF.reduce((s, t) => s + t.duration, 0) / tradingOnlyF.length) : 0;

        const chronoF = [...friendTrades].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        const dayPnlF = {};
        const dayPayoutF = {};
        chronoF.forEach((t) => {
          dayPnlF[t.date] = (dayPnlF[t.date] || 0) + t.pnl;
          if (t.entryType === "payout") dayPayoutF[t.date] = (dayPayoutF[t.date] || 0) + t.pnl;
        });
        const equityCurveF = [];
        if (chronoF.length) {
          const startF = chronoF[0].date;
          const endF = chronoF[chronoF.length - 1].date;
          equityCurveF.push({ date: prevDay(startF), balance: 0, minBalance: null, payoutTotal: 0 });
          let runningF = 0;
          let curF = startF;
          let guardF = 0;
          while (curF <= endF && guardF < 5000) {
            runningF += dayPnlF[curF] || 0;
            if (!isWeekend(curF) || dayPnlF[curF] !== undefined) {
              equityCurveF.push({ date: curF, balance: runningF, minBalance: null, payoutTotal: dayPayoutF[curF] || 0 });
            }
            if (curF === endF) break;
            curF = nextDay(curF);
            guardF++;
          }
        }

        const friendDayMap = friendTrades.reduce((acc, t) => {
          if (!acc[t.date]) acc[t.date] = { total: 0, count: 0, wins: 0, payoutTotal: 0 };
          if (t.entryType === "payout") {
            acc[t.date].payoutTotal += t.pnl;
          } else {
            acc[t.date].total += t.pnl;
            acc[t.date].count += 1;
            if (t.pnl > 0) acc[t.date].wins += 1;
          }
          return acc;
        }, {});
        const friendCalendarWeeks = buildCalendarWeeks(friendDayMap, friendCalYear, friendCalMonth);
        const friendFirstEntryDate = chronoF.length ? chronoF[0].date : null;
        const friendFirstEntryYear = friendFirstEntryDate ? Number(friendFirstEntryDate.slice(0, 4)) : null;
        const friendFirstEntryMonth = friendFirstEntryDate ? Number(friendFirstEntryDate.slice(5, 7)) - 1 : null;
        const friendAtEarliestMonth = friendFirstEntryDate !== null && (friendCalYear < friendFirstEntryYear || (friendCalYear === friendFirstEntryYear && friendCalMonth <= friendFirstEntryMonth));
        const friendMonthLabel = new Date(friendCalYear, friendCalMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

        return (
          <div onClick={closeFriendPerformance} style={{ position: "fixed", inset: 0, background: "rgba(20,20,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 60 }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{viewingFriend.label}'s performance</div>
                <button onClick={closeFriendPerformance} style={deleteBtnStyle_()} aria-label="Close">✕</button>
              </div>
              {friendTradesLoading ? (
                <div style={{ color: COLORS.textMuted, fontSize: 13, textAlign: "center", padding: "30px 0" }}>Loading…</div>
              ) : friendTradesError ? (
                <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "10px 14px", borderRadius: 10, fontSize: 13 }}>{friendTradesError}</div>
              ) : tradingOnlyF.length === 0 ? (
                <EmptyState text="This friend hasn't logged any trades yet." />
              ) : (
                <>
                  <div className="stats-grid" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
                    <StatCard label="Total P&L" value={fmtMoney(totalPnlF)} color={totalPnlF >= 0 ? COLORS.win : COLORS.loss} />
                    <StatCard label="Win rate" value={`${winRateF}%`} />
                    <StatCard label="Profit factor" value={profitFactorF === Infinity ? "∞" : profitFactorF.toFixed(2)} />
                    <StatCard label="Avg duration" value={fmtDuration(avgDurationF)} />
                  </div>
                  <EquityChart points={equityCurveF} height={260} payoutColor={COLORS.payout} />

                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "24px 0 12px" }}>
                    <button
                      onClick={() => { if (friendAtEarliestMonth) return; const m = friendCalMonth - 1; if (m < 0) { setFriendCalMonth(11); setFriendCalYear(friendCalYear - 1); } else setFriendCalMonth(m); }}
                      disabled={friendAtEarliestMonth}
                      style={{ ...ghostBtnStyle_(), opacity: friendAtEarliestMonth ? 0.4 : 1, cursor: friendAtEarliestMonth ? "not-allowed" : "pointer" }}
                    >
                      ← Prev
                    </button>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{friendMonthLabel}</div>
                    <button
                      onClick={() => { const m = friendCalMonth + 1; if (m > 11) { setFriendCalMonth(0); setFriendCalYear(friendCalYear + 1); } else setFriendCalMonth(m); }}
                      style={ghostBtnStyle_()}
                    >
                      Next →
                    </button>
                  </div>

                  <div style={{ overflowX: "auto" }}>
                    <div style={{ minWidth: 560 }}>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr) 90px", gap: 8, marginBottom: 8 }}>
                        {WEEKDAY_LABELS.map((wd) => (
                          <div key={wd} style={{ fontSize: 11, fontWeight: 700, color: COLORS.textMuted, textAlign: "center", padding: "4px 0" }}>{wd}</div>
                        ))}
                        <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.textMuted, textAlign: "center", padding: "4px 0" }}>Total</div>
                      </div>
                      {friendCalendarWeeks.map((week, wi) => (
                        <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr) 90px", gap: 8, marginBottom: 8 }}>
                          {week.cells.slice(1, 6).map((cell, ci) => {
                            if (!cell) {
                              return <div key={ci} style={{ background: COLORS.subtleBg, border: `1px solid ${COLORS.border}`, borderRadius: 10, minHeight: 58 }} />;
                            }
                            const d = cell.data;
                            const hasTrades = !!(d && d.count > 0);
                            const isWin = hasTrades && d.total >= 0;
                            const cellColor = isWin ? COLORS.win : COLORS.loss;
                            const cellSoft = isWin ? COLORS.win + "1E" : COLORS.loss + "1E";
                            const hasPayout = !!(d && d.payoutTotal);
                            return (
                              <div
                                key={ci}
                                style={{
                                  position: "relative",
                                  borderRadius: 10, minHeight: 58, padding: "6px 8px",
                                  background: hasTrades ? cellSoft : COLORS.subtleBg,
                                  border: `1.5px solid ${hasTrades ? cellColor : COLORS.border}`,
                                  display: "flex", flexDirection: "column", justifyContent: "space-between",
                                }}
                              >
                                {hasPayout && (
                                  <div
                                    title={`Payout: ${fmtMoney(d.payoutTotal)}`}
                                    style={{
                                      position: "absolute", top: 5, right: 5, width: 7, height: 7, borderRadius: "50%",
                                      background: COLORS.payout,
                                      boxShadow: `0 0 0 2px ${COLORS.card}`,
                                    }}
                                  />
                                )}
                                <div style={{ fontSize: 12, color: hasTrades ? cellColor : COLORS.textMuted, fontWeight: 600 }}>{cell.day}</div>
                                {hasTrades && (
                                  <div className="mono" style={{ fontSize: 12.5, fontWeight: 700, color: cellColor }}>{fmtMoney(d.total)}</div>
                                )}
                              </div>
                            );
                          })}
                          <div
                            style={{
                              borderRadius: 10, minHeight: 58, padding: "6px 8px",
                              background: week.tradeCount ? (week.total >= 0 ? COLORS.win + "1E" : COLORS.loss + "1E") : COLORS.subtleBg,
                              border: `1.5px solid ${week.tradeCount ? (week.total >= 0 ? COLORS.win : COLORS.loss) : COLORS.border}`,
                              display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",
                            }}
                          >
                            {week.tradeCount ? (
                              <div className="mono" style={{ fontSize: 12, fontWeight: 700, color: week.total >= 0 ? COLORS.win : COLORS.loss }}>{fmtMoney(week.total)}</div>
                            ) : (
                              <div style={{ fontSize: 11, color: COLORS.textMuted }}>—</div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {targetsPopped && (
        <FloatingTargetsWindow onClose={() => setTargetsPopped(false)}>
          <TargetsPanel targets={targets} updateTargets={updateTargets} profitTargetHit={profitTargetHit} maxLossHit={maxLossHit} dailyLossLimitHitToday={!!(dayMap[todayStr()] && dayMap[todayStr()].dllHit)} />

      {openGroup && (() => {
        const groupConfluenceNameById = Object.fromEntries(groupConfluences.map((c) => [c.id, c.name]));
        const groupTradeConfluenceMap = {};
        groupTradeConfluenceLinks.forEach((l) => {
          if (!groupTradeConfluenceMap[l.trade_id]) groupTradeConfluenceMap[l.trade_id] = [];
          groupTradeConfluenceMap[l.trade_id].push(l.group_confluence_id);
        });
        Object.keys(groupTradeConfluenceMap).forEach((k) => {
          groupTradeConfluenceMap[k] = Array.from(new Set(groupTradeConfluenceMap[k])).sort();
        });
        const groupPatternConfluenceMap = {};
        groupPatternConfluenceLinks.forEach((l) => {
          if (!groupPatternConfluenceMap[l.group_pattern_id]) groupPatternConfluenceMap[l.group_pattern_id] = [];
          groupPatternConfluenceMap[l.group_pattern_id].push(l.group_confluence_id);
        });
        Object.keys(groupPatternConfluenceMap).forEach((k) => groupPatternConfluenceMap[k].sort());
        const groupPatternPerf = groupPatterns
          .filter((p) => (groupPatternConfluenceMap[p.id] || []).length > 0)
          .map((p) => {
          const confIds = groupPatternConfluenceMap[p.id] || [];
          const label = confIds.map((id) => groupConfluenceNameById[id] || "?").join(" + ");
          const taggedTradeIds = Object.keys(groupTradeConfluenceMap).filter((tid) => {
            const arr = groupTradeConfluenceMap[tid];
            return arr.length === confIds.length && arr.every((v, i) => v === confIds[i]);
          });
          const taggedTrades = taggedTradeIds.map((tid) => groupTaggedTrades[tid]).filter(Boolean).filter((t) => t.entryType !== "payout");
          const count = taggedTrades.length;
          const total = taggedTrades.reduce((s, t) => s + t.pnl, 0);
          const wins = taggedTrades.filter((t) => t.pnl > 0).length;
          const winRateP = count ? Math.round((wins / count) * 100) : 0;
          return { id: p.id, label, grade: p.grade, count, total, winRateP };
        });

                        {groupConfluences.length === 0 ? (
                          <div style={{ fontSize: 12, color: COLORS.textMuted }}>Add group confluences in Settings first.</div>
                        ) : (
                          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                            {groupConfluences.map((c) => {
                              const active = tagConfluenceIds.includes(c.id);
                              return (
                                <button type="button" key={c.id} onClick={() => toggleTagConfluence(c.id)} style={{ background: active ? COLORS.accentSoft : COLORS.subtleBg, border: `1.5px solid ${active ? COLORS.accent : COLORS.border}`, color: active ? COLORS.accent : COLORS.textMuted, padding: "5px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                                  {c.name}

                              );
                            })}
                          </div>
                        )}
                        {groupTargetTags.length > 0 && (
                          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                            {groupTargetTags.map((tg) => {
                              const active = tagTargetTagIds.includes(tg.id);
                              return (
                                <button type="button" key={tg.id} onClick={() => toggleTagTargetTag(tg.id)} style={{ background: active ? COLORS.accentSoft : COLORS.subtleBg, border: `1.5px solid ${active ? COLORS.accent : COLORS.border}`, color: active ? COLORS.accent : COLORS.textMuted, padding: "5px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                                  {tg.name}
                                </button>
                              );
                            })}
                          </div>
                        )}
                        {tagError && (
                          <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "8px 12px", borderRadius: 8, fontSize: 12.5 }}>{tagError}</div>
                        )}
                        <button type="submit" style={{ ...primaryBtnStyle_(), justifySelf: "start" }}>Tag trade</button>
                      </form>
                    </details>

                    <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textMuted, marginBottom: 8 }}>CHAT</div>
                    {groupMessages.length === 0 ? (
                      <EmptyState text="No messages yet — say hi." />
                    ) : (
                      <div style={{ display: "grid", gap: 8 }}>
                        {groupMessages.map((m) => {
                          const sender = groupMembers.find((gm) => gm.id === m.user_id);
                          const senderLabel = m.user_id === userId ? "You" : (sender && sender.profile ? (sender.profile.display_name || sender.profile.email) : "Unknown");
                          const mine = m.user_id === userId;
                          return (
                            <div key={m.id} style={{ display: "flex", justifyContent: mine ? "flex-end" : "flex-start" }}>
                              <div style={{ maxWidth: "78%", background: mine ? COLORS.accent : COLORS.subtleBg, color: mine ? "#fff" : COLORS.text, borderRadius: 14, padding: "8px 12px" }}>
                                {!mine && <div style={{ fontSize: 10.5, fontWeight: 700, opacity: 0.7, marginBottom: 2 }}>{senderLabel}</div>}
                                <div style={{ fontSize: 13.5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{m.body}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <form onSubmit={sendGroupMessage} style={{ display: "flex", gap: 8, alignItems: "center", padding: 14, borderTop: `1px solid ${COLORS.border}` }}>
                    <button type="button" onClick={() => setGroupView("settings")} style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: 18, padding: 4, color: COLORS.textMuted }} aria-label="Group settings">⚙️</button>
                    <input
                      type="text" value={groupMessageDraft} onChange={(e) => setGroupMessageDraft(e.target.value)}
                      placeholder="Message the group…" style={{ ...inputStyle_(), flex: 1 }}
                    />
                    <button type="submit" disabled={groupMessageSending || !groupMessageDraft.trim()} style={{ ...primaryBtnStyle_(), opacity: (groupMessageSending || !groupMessageDraft.trim()) ? 0.6 : 1 }}>
                      Send
                    </button>
                  </form>
                </>
              )}
            </div>

            {!isGroupFullscreen && (
              <div
                onMouseDown={startGroupResize}
                style={{ position: "absolute", right: 0, bottom: 0, width: 20, height: 20, cursor: "nwse-resize" }}
              >
                <svg width="14" height="14" viewBox="0 0 14 14" style={{ position: "absolute", right: 3, bottom: 3, opacity: 0.5, pointerEvents: "none" }}>
                  <path d="M12 2 L2 12 M12 7 L7 12" stroke={COLORS.textMuted} strokeWidth="1.5" />
                </svg>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

// ---- Top-level app: session check -> auth gate -> subscription gate -> the journal ----
function App() {
  const [theme] = useState(() => loadLocal(THEME_KEY, "light"));
  applyTheme(theme); // so the auth/paywall screens respect the stored theme too
  useEffect(() => {
    document.body.classList.toggle("dark-theme", theme === "dark");
  }, [theme]);

  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(true);
  const [checkoutBusy, setCheckoutBusy] = useState(false);
  const [checkoutError, setCheckoutError] = useState(null);
  const [portalBusy, setPortalBusy] = useState(false);
  const [portalError, setPortalError] = useState(null);
  const [activating, setActivating] = useState(() => new URLSearchParams(window.location.search).get("checkout") === "success");

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => authListener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); setProfileLoading(false); return; }
    let cancelled = false;
    let attempts = 0;
    setProfileLoading(true);

    async function fetchProfile() {
      attempts += 1;
      const { data, error } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (!error && data) {
        setProfile(data);
        setProfileLoading(false);
        return;
      }
      // The profile row is created by a DB trigger right after signup — on the
      // very first login it can occasionally lag by a moment.
      if (attempts < 5) {
        setTimeout(fetchProfile, 800);
      } else {
        setProfileLoading(false);
      }
    }
    fetchProfile();
    return () => { cancelled = true; };
  }, [session && session.user.id]);

  // Poll briefly after a Stripe Checkout redirect for the webhook to flip the status to active.
  useEffect(() => {
    if (!activating || !session) return;
    let cancelled = false;
    let attempts = 0;
    const interval = setInterval(async () => {
      attempts += 1;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (data) setProfile(data);
      if ((data && data.subscription_status === "active") || attempts >= 10) {
        clearInterval(interval);
        setActivating(false);
        const url = new URL(window.location.href);
        url.searchParams.delete("checkout");
        window.history.replaceState({}, "", url.toString());
      }
    }, 2000);
    return () => { cancelled = true; clearInterval(interval); };
  }, [activating, session && session.user.id]);

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  async function handleSubscribe() {
    setCheckoutBusy(true);
    setCheckoutError(null);
    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/create-checkout-session", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      const body = await res.json();
      if (!res.ok || !body.url) throw new Error(body.error || "Could not start checkout.");
      window.location.href = body.url;
    } catch (err) {
      setCheckoutError(err.message || "Could not start checkout.");
      setCheckoutBusy(false);
    }
  }

  async function handleManageBilling() {
    setPortalBusy(true);
    setPortalError(null);
    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/create-portal-session", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      const body = await res.json();
      if (!res.ok || !body.url) throw new Error(body.error || "Could not open billing portal.");
      window.location.href = body.url;
    } catch (err) {
      setPortalError(err.message || "Could not open billing portal.");
      setPortalBusy(false);
    }
  }

  const loadingScreen = (text) => (
    <div style={{ display: "flex", minHeight: "100vh", alignItems: "center", justifyContent: "center", background: COLORS.bg, color: COLORS.textMuted, fontFamily: "'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" }}>
      {text}
    </div>
  );

  if (session === undefined) return loadingScreen("Loading…");
  if (session === null) return <AuthScreen />;
  if (profileLoading) return loadingScreen("Setting up your account…");
  if (activating) return loadingScreen("Activating your account…");

  const status = profile ? profile.subscription_status : "trialing";
  const nowMs = Date.now();
  const createdAtMs = profile ? new Date(profile.created_at).getTime() : nowMs;
  const trialEndMs = createdAtMs + 7 * 24 * 60 * 60 * 1000;
  const periodEndMs = profile && profile.current_period_end ? new Date(profile.current_period_end).getTime() : null;
  const graceMs = 3 * 24 * 60 * 60 * 1000;
  const allowed =
    status === "active" ||
    (status === "trialing" && nowMs < trialEndMs) ||
    (status === "past_due" && periodEndMs !== null && nowMs < periodEndMs + graceMs);

  if (!allowed) {
    return (
      <Paywall
        status={status}
        onLogout={handleLogout}
        onSubscribe={handleSubscribe}
        checkoutBusy={checkoutBusy}
        checkoutError={checkoutError}
      />
    );
  }

  return (
    <TradeJournal
      session={session}
      onLogout={handleLogout}
      initialDisplayName={profile ? profile.display_name : ""}
      subscriptionStatus={status}
      currentPeriodEnd={profile ? profile.current_period_end : null}
      trialEndMs={trialEndMs}
      onManageBilling={handleManageBilling}
      portalBusy={portalBusy}
      portalError={portalError}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
