const THEME_KEY = "tj_theme_v1";
// Mutable — mutated in place (not reassigned) so every component reading COLORS
// picks up the new palette immediately when the theme toggles.
const COLORS = { ...LIGHT_COLORS };
function applyTheme(themeName) {
  Object.assign(COLORS, themeName === "dark" ? DARK_COLORS : LIGHT_COLORS);
}

const GRADES = ["B-", "B", "B+", "A-", "A", "A+", "A++"];
const GRADE_RANK = Object.fromEntries(GRADES.map((g, i) => [g, i]));
function gradeColor(grade) {
  if (!grade) return null;
  const rank = GRADE_RANK[grade];
  if (rank >= 3) return "#16A34A";       // A- through A++
  return "#2563EB";                       // B- through B+
}
function pnlColor(t) {
  if (t.entryType === "payout") return COLORS.payout;
  return t.pnl >= 0 ? COLORS.win : COLORS.loss;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function fmtMoney(n) {
  const num = Number(n) || 0;
  const sign = num > 0 ? "+" : num < 0 ? "−" : "";
  return `${sign}$${Math.abs(num).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function fmtDuration(totalSeconds) {
  const s = Math.max(0, Math.round(Number(totalSeconds) || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const parts = [];
  if (h) parts.push(`${h}h`);
  if (m) parts.push(`${m}m`);
  if (sec || parts.length === 0) parts.push(`${sec}s`);
  return parts.join(" ");
}
function secondsToHMS(totalSeconds) {
  const s = Math.max(0, Math.round(Number(totalSeconds) || 0));
  return { h: Math.floor(s / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
}
function loadLocal(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveLocal(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

// ---- Media storage (Supabase Storage — replaces the old IndexedDB blob store) ----
function mediaPath(userId, tradeId, pathId, filename) {
  return `${userId}/${tradeId}/${pathId}-${filename}`;
}
async function uploadMediaFile(path, file) {
  const { error } = await supabaseClient.storage.from(MEDIA_BUCKET).upload(path, file, { upsert: false });
  if (error) throw error;
}
async function getMediaSignedUrl(path) {
  const { data, error } = await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}
async function removeMediaFiles(paths) {
  if (!paths.length) return;
  const { error } = await supabaseClient.storage.from(MEDIA_BUCKET).remove(paths);
  if (error) throw error;
}

// ---- Supabase row <-> app object mapping ----
function rowToTrade(row) {
  return {
    id: row.id,
    date: row.date,
    symbol: row.symbol || "",
    side: row.side || "long",
    pnl: Number(row.pnl),
    duration: Number(row.duration_seconds) || 0,
    risk: row.risk === null || row.risk === undefined ? null : Number(row.risk),
    rr: row.rr === null || row.rr === undefined ? null : Number(row.rr),
    grade: row.grade || null,
    entryType: row.entry_type,
    media: [],
  };
}
function tradeToRow(t, userId) {
  return {
    user_id: userId,
    date: t.date,
    symbol: t.symbol ? t.symbol : null,
    side: t.entryType === "payout" ? null : (t.side || "long"),
    pnl: Number(t.pnl) || 0,
    duration_seconds: Number(t.duration) || 0,
    risk: t.risk === "" || t.risk === null || t.risk === undefined ? null : Number(t.risk),
    rr: t.rr === "" || t.rr === null || t.rr === undefined ? null : Number(t.rr),
    grade: t.grade || null,
    entry_type: t.entryType || "trade",
  };
}
function rowToEntry(row) {
  return {
    id: row.id,
    date: row.date,
    mood: row.mood,
    feelingDetail: row.feeling_detail || "",
    conditions: row.conditions || "",
    notes: row.notes || "",
    tradeId: row.trade_id || null,
  };
}
function entryToRow(en, userId) {
  return {
    user_id: userId,
    date: en.date,
    mood: en.mood,
    feeling_detail: en.feelingDetail ? en.feelingDetail : null,
    conditions: en.conditions ? en.conditions : null,
    notes: en.notes ? en.notes : null,
    trade_id: en.tradeId || null,

}
function rowToTargets(row) {
  if (!row) {
    return {
      profitTarget: "", maxLoss: "", axisStep: "",
      profitColor: "#16A34A", minBalanceColor: "#E23D45", growthColor: "",
      axisColor: "",
      calWinColor: "#16A34A", calLossColor: "#E23D45", calPayoutColor: "#0EA5E9",

  }
  return {
    profitTarget: row.profit_target === null || row.profit_target === undefined ? "" : String(row.profit_target),
    maxLoss: row.max_loss === null || row.max_loss === undefined ? "" : String(row.max_loss),
    axisStep: row.axis_step === null || row.axis_step === undefined ? "" : String(row.axis_step),
    profitColor: row.profit_color || "#16A34A",
    minBalanceColor: row.min_balance_color || "#E23D45",
    growthColor: row.growth_color || "",
    axisColor: row.axis_color || "",
    calWinColor: row.cal_win_color || "#16A34A",
    calLossColor: row.cal_loss_color || "#E23D45",
    calPayoutColor: row.cal_payout_color || "#0EA5E9",

function targetsToRow(t, userId) {

// ---- Trade media modal (stable top-level component) ----
function TradeMediaModal({ trade, onClose, onAddFiles, onDeleteMedia }) {
  const [urls, setUrls] = useState({});
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [lightbox, setLightbox] = useState(null); // { id, url, type, name }

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      const next = {};
      for (const m of trade.media || []) {
        try {
          const url = await getMediaSignedUrl(m.storagePath);
          next[m.id] = url;
        } catch (e) { /* skip missing file */ }
      }
      if (!cancelled) { setUrls(next); setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [trade.id, (trade.media || []).map((m) => m.id).join(",")]);

  async function handleFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setBusy(true);
    await onAddFiles(trade.id, files);
    setBusy(false);
  }

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,20,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 60 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 16, padding: 24, width: "100%", maxWidth: 640, maxHeight: "82vh", overflowY: "auto", boxShadow: "0 20px 60px rgba(20,20,35,0.35)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 2 }}>{trade.date} · {trade.symbol || "—"}</div>
            <div style={{ fontSize: 16, fontWeight: 700 }}>Photos & videos</div>
          </div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: COLORS.textMuted, cursor: "pointer", fontSize: 14 }} aria-label="Close">✕</button>
        </div>

        <label style={{
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          border: `1.5px dashed ${COLORS.border}`, borderRadius: 12, padding: "18px 14px",
          color: COLORS.accent, fontSize: 13.5, fontWeight: 600, cursor: "pointer", marginBottom: 16,
          background: COLORS.accentSoft,
        }}>
          {busy ? "Uploading…" : "+ Add photos or videos"}
          <input type="file" accept="image/*,video/*" multiple onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} style={{ display: "none" }} disabled={busy} />
        </label>

        {loading ? (
          <div style={{ color: COLORS.textMuted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Loading…</div>
        ) : (trade.media || []).length === 0 ? (
          <EmptyState text="No photos or videos yet. Add a chart screenshot or trade recap above." />
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10 }}>
            {(trade.media || []).map((m) => (
              <div key={m.id} style={{ position: "relative", borderRadius: 10, overflow: "hidden", border: `1px solid ${COLORS.border}`, background: "#000", aspectRatio: "1 / 1" }}>
                {urls[m.id] ? (
                  m.type === "video" ? (
                    <video src={urls[m.id]} controls style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  ) : (
                    <img
                      src={urls[m.id]}
                      alt={m.name || "trade media"}
                      onClick={() => setLightbox({ id: m.id, url: urls[m.id], type: m.type, name: m.name })}
                      style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "zoom-in" }}
                    />
                  )
                ) : (
                  <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.textMuted, fontSize: 11 }}>Unavailable</div>
                )}
                {urls[m.id] && m.type === "video" && (
                  <button
                    onClick={() => setLightbox({ id: m.id, url: urls[m.id], type: m.type, name: m.name })}
                    style={{ position: "absolute", top: 4, left: 4, background: "rgba(20,20,35,0.7)", color: "#fff", border: "none", borderRadius: 6, padding: "2px 7px", cursor: "pointer", fontSize: 11, lineHeight: 1.4 }}
                    aria-label="Expand video"
                  >
                    ⤢
                  </button>
                )}
                <button
                  onClick={() => onDeleteMedia(trade.id, m.id)}
                  style={{ position: "absolute", top: 4, right: 4, background: "rgba(20,20,35,0.7)", color: "#fff", border: "none", borderRadius: 6, width: 22, height: 22, cursor: "pointer", fontSize: 12, lineHeight: 1 }}
                  aria-label="Delete media"
                >
                  ✕
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {lightbox && (
        <div
          onClick={(e) => { e.stopPropagation(); setLightbox(null); }}
          style={{ position: "fixed", inset: 0, background: "rgba(10,10,18,0.92)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, padding: 24 }}
        >
          <button
            onClick={(e) => { e.stopPropagation(); setLightbox(null); }}
            style={{ position: "absolute", top: 18, right: 22, background: "rgba(255,255,255,0.12)", color: "#fff", border: "none", borderRadius: 8, width: 34, height: 34, cursor: "pointer", fontSize: 16 }}
            aria-label="Close full view"
          >
            ✕
          </button>
          {lightbox.type === "video" ? (
            <video src={lightbox.url} controls autoPlay onClick={(e) => e.stopPropagation()} style={{ maxWidth: "92vw", maxHeight: "88vh", borderRadius: 8 }} />
          ) : (
            <img src={lightbox.url} alt={lightbox.name || "trade media"} onClick={(e) => e.stopPropagation()} style={{ maxWidth: "92vw", maxHeight: "88vh", objectFit: "contain", borderRadius: 8 }} />
          )}
        </div>
      )}
    </div>
  );
}

function smoothPath(pts) {
  if (pts.length < 2) return "";
  if (pts.length === 2) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function EquityChart({ points, width = 900, height = 220, profitTarget = null, maxLossLevel = null, axisStep = null, growthColor = null, profitColor = null, minBalanceColor = null, axisColor = null }) {
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);

  if (!points || points.length < 2) {
    return (
      <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.textMuted, fontSize: 13 }}>
        Log trades to see your account grow.
      </div>
    );
  }
  const balances = points.map((p) => p.balance);
  const minBalanceOnly = Math.min(...balances);
  const targetLevels = [];
  if (profitTarget !== null && !Number.isNaN(profitTarget)) targetLevels.push(profitTarget);
  if (maxLossLevel !== null && !Number.isNaN(maxLossLevel)) targetLevels.push(maxLossLevel);
  const allMinBalances = points.map((p) => p.minBalance).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
  if (allMinBalances.length) targetLevels.push(Math.min(...allMinBalances), Math.max(...allMinBalances));
  const max = Math.max(0, ...balances, ...targetLevels);
  const min = Math.min(0, ...balances, ...targetLevels);
  const range = max - min || 1;
  const padTop = 16, padBottom = 34, padRight = 62;
  const usableH = height - padTop - padBottom;
  const stepX = (width - padRight) / (points.length - 1);

  function xAt(i) { return i * stepX; }
  function yAt(bal) { return padTop + usableH - ((bal - min) / range) * usableH; }
  const zeroY = yAt(0);

  function fmtAxis(v) {
    const sign = v < 0 ? "−" : "";
    const abs = Math.abs(v);
    if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(abs % 1000 === 0 ? 0 : 1)}k`;
    return `${sign}$${Math.round(abs)}`;
  }
  function niceStep(span, targetCount) {
    const roughStep = span / Math.max(targetCount, 1);
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep || 1)));
    const residual = roughStep / magnitude;
    let niceResidual;
    if (residual > 5) niceResidual = 10;
    else if (residual > 2) niceResidual = 5;
    else if (residual > 1) niceResidual = 2;
    else niceResidual = 1;
    return niceResidual * magnitude;
  }
  const yStep = (axisStep !== null && !Number.isNaN(axisStep) && axisStep > 0) ? axisStep : (niceStep(range, 4) || 1);
  const yTickStart = Math.ceil(min / yStep) * yStep;
  const yTicksRaw = [];
  for (let v = yTickStart; v <= max + yStep * 0.001; v += yStep) yTicksRaw.push(Math.round(v * 100) / 100);
  const yTicks = yTicksRaw.length ? yTicksRaw : [min, max];

  const linePoints = points.map((p, i) => ({ x: xAt(i), y: yAt(p.balance) }));
  const linePath = smoothPath(linePoints);
  const chartBottomY = height - padBottom + 10;
  const areaPath = `${linePath} L ${xAt(points.length - 1).toFixed(1)} ${chartBottomY.toFixed(1)} L 0 ${chartBottomY.toFixed(1)} Z`;
  const last = points[points.length - 1];
  const positive = last.balance >= 0;
  const lineColor = growthColor || (positive ? COLORS.win : COLORS.loss);

  const datedPoints = points.filter((p) => p.date);
  const years = new Set(datedPoints.map((p) => p.date.slice(0, 4)));
  const showYear = years.size > 1;

  function fmtTick(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr + "T00:00:00");
    if (Number.isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString(undefined, showYear ? { month: "short", day: "numeric", year: "2-digit" } : { month: "short", day: "numeric" });
  }

  // De-duplicate the synthetic starting point when it falls on the same day as the first real trade
  let dedupedPoints = points;
  if (points.length > 2 && points[0].date === points[1].date) {
    dedupedPoints = [{ ...points[0], synthetic: true }, ...points.slice(1)];
  }

  function handleMouseMove(e) {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const relX = e.clientX - rect.left;
    const svgX = (relX / rect.width) * width;
    let idx = Math.round(svgX / stepX);
    idx = Math.max(0, Math.min(dedupedPoints.length - 1, idx));
    setHoverIdx(idx);
  }
  function handleMouseLeave() { setHoverIdx(null); }

  const desiredTickCount = Math.min(Math.max(4, Math.floor((width - padRight) / 55)), dedupedPoints.length);
  const step = Math.max(1, Math.ceil((dedupedPoints.length - 1) / Math.max(desiredTickCount - 1, 1)));
  const rawTickIdxs = [];
  for (let i = 0; i < dedupedPoints.length; i += step) rawTickIdxs.push(i);
  // Drop ticks whose label duplicates the previous shown tick's label (avoids "Jul 7 · Jul 7")
  const tickIdxs = [];
  let lastLabel = null;
  rawTickIdxs.forEach((i) => {
    const lbl = fmtTick(dedupedPoints[i].date);
    if (lbl !== lastLabel) {
      tickIdxs.push(i);
      lastLabel = lbl;
    }
  });

  return (
    <svg
      ref={svgRef}
      viewBox={`0 0 ${width} ${height}`}
      width="100%"
      height={height}
      preserveAspectRatio="none"
      style={{ display: "block", overflow: "visible", cursor: "crosshair" }}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
    >
      <defs>
        <linearGradient id="equityFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.38" />
          <stop offset="100%" stopColor={lineColor} stopOpacity="0.04" />
        </linearGradient>
      </defs>

      {/* $ scale with horizontal gridlines — on the right */}
      {yTicks.map((v, i) => (
        <g key={i}>
          <line x1="0" y1={yAt(v)} x2={width - padRight} y2={yAt(v)} stroke={axisColor || COLORS.border} strokeWidth="1" />
          <text x={width - padRight + 8} y={yAt(v) + 3.5} textAnchor="start" fontSize="10.5" fill={axisColor || COLORS.textMuted}>
            {fmtAxis(v)}
          </text>
        </g>
      ))}

      {profitTarget !== null && !Number.isNaN(profitTarget) && (
        <>
          <line x1="0" y1={yAt(profitTarget)} x2={width - padRight} y2={yAt(profitTarget)} stroke={profitColor || COLORS.win} strokeWidth="1.5" strokeDasharray="6 4" />
          <text x={width - padRight - 4} y={yAt(profitTarget) - 5} textAnchor="end" fontSize="11" fontWeight="700" fill={profitColor || COLORS.win}>
            Profit target {fmtMoney(profitTarget)}
          </text>
        </>
      )}
      {(() => {
        const minBalPts = points.map((p, i) => ({ i, v: p.minBalance })).filter((p) => p.v !== null && p.v !== undefined);
        if (!minBalPts.length) return null;
        const minBalPath = smoothPath(minBalPts.map((p) => ({ x: xAt(p.i), y: yAt(p.v) })));
        const lastPt = minBalPts[minBalPts.length - 1];
        return (
          <>
            <path d={minBalPath} fill="none" stroke={minBalanceColor || COLORS.loss} strokeWidth="1.5" strokeDasharray="6 4" />
            <text x={width - padRight - 4} y={yAt(lastPt.v) + 18} textAnchor="end" fontSize="11" fontWeight="700" fill={minBalanceColor || COLORS.loss}>
              Minimum balance {fmtMoney(lastPt.v)}
            </text>
          </>
        );
      })()}

      <path d={areaPath} fill="url(#equityFill)" stroke="none" />
      <path d={linePath} fill="none" stroke={lineColor} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={xAt(points.length - 1)} cy={yAt(last.balance)} r="4.5" fill={lineColor} />

      {/* x-axis */}
      <line x1="0" y1={height - padBottom + 10} x2={width - padRight} y2={height - padBottom + 10} stroke={axisColor || COLORS.border} strokeWidth="1" />
      {tickIdxs.map((i) => {
        const anchor = i === 0 ? "start" : i === dedupedPoints.length - 1 ? "end" : "middle";
        const tx = xAt(i);
        return (
          <g key={i}>
            <line x1={tx} y1={height - padBottom + 10} x2={tx} y2={height - padBottom + 14} stroke={axisColor || COLORS.border} strokeWidth="1" />
            <text x={tx} y={height - 8} textAnchor={anchor} fontSize="10.5" fontWeight="500" fill={axisColor || COLORS.textMuted}>
              {fmtTick(dedupedPoints[i].date)}
            </text>
          </g>
        );
      })}

      {/* Hover: crosshair + tooltip showing the date, running balance, and max loss level */}
      {hoverIdx !== null && (() => {
        const hp = dedupedPoints[hoverIdx];
        const hx = xAt(hoverIdx);
        const hy = yAt(hp.balance);
        const hasMaxLoss = hp.minBalance !== null && hp.minBalance !== undefined && !Number.isNaN(hp.minBalance);
        const hoverDateLabel = hp.date ? new Date(hp.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
        const boxW = 180, boxH = 20 + (hasMaxLoss ? 46 : 28);
        const boxX = Math.min(Math.max(hx + 10, 0), width - boxW);
        const boxY = Math.min(Math.max(hy - boxH - 10, padTop), height - padBottom - boxH);
        return (
          <g pointerEvents="none">
            <line x1={hx} y1={padTop} x2={hx} y2={height - padBottom + 10} stroke={COLORS.textMuted} strokeWidth="1" strokeDasharray="3 3" />
            <circle cx={hx} cy={hy} r="4.5" fill={lineColor} stroke={COLORS.card} strokeWidth="1.5" />
            <rect x={boxX} y={boxY} width={boxW} height={boxH} rx="8" fill={COLORS.card} stroke={COLORS.border} strokeWidth="1" />
            {hoverDateLabel && (
              <text x={boxX + 10} y={boxY + 15} fontSize="10.5" fontWeight="700" fill={COLORS.text}>
                {hoverDateLabel}
              </text>
            )}
            <text x={boxX + 10} y={boxY + 33} fontSize="11" fontWeight="700" fill={COLORS.textMuted}>
              Balance: {fmtMoney(hp.balance)}
            </text>
            {hasMaxLoss && (
              <text x={boxX + 10} y={boxY + 50} fontSize="11" fontWeight="700" fill={COLORS.textMuted}>
                Minimum balance: {fmtMoney(hp.minBalance)}
              </text>
            )}
          </g>
        );
      })()}
    </svg>
  );
}

// ---- Auth screen (shown when there is no Supabase session) ----
function AuthScreen() {
  const [mode, setMode] = useState("login"); // 'login' | 'signup'
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [nickname, setNickname] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [message, setMessage] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setError(null);
    setMessage(null);
    if (!email || !password) { setError("Enter an email and password."); return; }
    if (mode === "signup" && !nickname.trim()) { setError("Enter a nickname — it's what your friends will see."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const { error: err } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { display_name: nickname.trim() } },
        });
        if (err) throw err;
        setMessage("Account created. Check your email to confirm it, then log in.");
        setMode("login");
      } else {
        const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (err) throw err;
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh", alignItems: "center", justifyContent: "center", background: COLORS.bg, fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" }}>
      <form onSubmit={submit} style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 32, width: "100%", maxWidth: 380, display: "grid", gap: 16, boxShadow: "0 1px 2px rgba(23,21,51,0.04)" }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.text, marginBottom: 4 }}>A+ Trades</div>
          <div style={{ fontSize: 13, color: COLORS.textMuted }}>{mode === "signup" ? "Create your account" : "Log in to your account"}</div>
        </div>
        {mode === "signup" && (
          <Field label="Nickname (shown to friends)">
            <input type="text" value={nickname} onChange={(e) => setNickname(e.target.value)} placeholder="e.g. Jakub" style={inputStyle_()} autoComplete="nickname" />
          </Field>
        )}
        <Field label="Email">
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" style={inputStyle_()} autoComplete="email" />
        </Field>
        <Field label="Password">
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" style={inputStyle_()} autoComplete={mode === "signup" ? "new-password" : "current-password"} />
        </Field>
        {error && (
          <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "10px 14px", borderRadius: 10, fontSize: 13 }}>{error}</div>
        )}
        {message && (
          <div style={{ background: COLORS.winSoft, border: `1px solid ${COLORS.win}33`, color: COLORS.win, padding: "10px 14px", borderRadius: 10, fontSize: 13 }}>{message}</div>
        )}
        <button type="submit" disabled={busy} style={{ ...primaryBtnStyle_(), justifySelf: "stretch", textAlign: "center", opacity: busy ? 0.7 : 1 }}>
          {busy ? "Please wait…" : mode === "signup" ? "Sign up" : "Log in"}
        </button>
        <button
          type="button"
          onClick={() => { setMode(mode === "signup" ? "login" : "signup"); setError(null); setMessage(null); }}
          style={{ background: "transparent", border: "none", color: COLORS.accent, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
        >
          {mode === "signup" ? "Already have an account? Log in" : "New here? Create an account"}
        </button>
      </form>
    </div>
  );
}

      supabaseClient.from("target_tags").select("*").order("name", { ascending: true }),
      supabaseClient.from("trade_target_tags").select("*"),
    ]);
    if (tradesRes.error) throw tradesRes.error;
    if (entriesRes.error) throw entriesRes.error;
    if (targetsRes.error) throw targetsRes.error;
    if (mediaRes.error) throw mediaRes.error;
    if (confluencesRes.error) throw confluencesRes.error;
    if (tradeConfluencesRes.error) throw tradeConfluencesRes.error;
    if (patternsRes.error) throw patternsRes.error;

    if (targetTagsRes.error) throw targetTagsRes.error;
    if (tradeTargetTagsRes.error) throw tradeTargetTagsRes.error;

    const mediaByTrade = {};
    (mediaRes.data || []).forEach((row) => {

  // ---- Patterns — a specific combination of confluences, auto-created the first
  // time a trade is tagged with that exact combo (order-independent match). ----
  function findMatchingPatternId(sortedConfluenceIds) {
    const byPattern = {};
    patternConfluenceLinks.forEach((l) => {
      if (!byPattern[l.pattern_id]) byPattern[l.pattern_id] = [];
      byPattern[l.pattern_id].push(l.confluence_id);
    });
    for (const [patternId, ids] of Object.entries(byPattern)) {
      const sorted = [...ids].sort();
      if (sorted.length === sortedConfluenceIds.length && sorted.every((v, i) => v === sortedConfluenceIds[i])) {
        return patternId;
      }
    }
    return null;
  }

  async function ensurePatternForConfluences(confluenceIds) {
    if (!confluenceIds.length) return;
    const sorted = [...confluenceIds].sort();
    if (findMatchingPatternId(sorted)) return;
    const { data: newPattern, error } = await supabaseClient.from("patterns").insert({ user_id: userId }).select().single();
    if (error) return;
    const pcRows = sorted.map((confluenceId) => ({ pattern_id: newPattern.id, confluence_id: confluenceId, user_id: userId }));
    const { error: pcError } = await supabaseClient.from("pattern_confluences").insert(pcRows);
    if (pcError) return;
    setPatternsList((prev) => [...prev, newPattern]);
    setPatternConfluenceLinks((prev) => [...prev, ...pcRows]);
  }

      }
      acc[key].count += 1; acc[key].total += t.pnl;
      if (t.pnl > 0) acc[key].wins += 1;
      acc[key].durationSum += t.duration;
      return acc;
    }, {})
  ).map((p) => ({ ...p, winRate: Math.round((p.wins / p.count) * 100), avg: p.total / p.count, avgDuration: Math.round(p.durationSum / p.count) }))
   .sort((a, b) => b.total - a.total);

  const bestPattern = patternStats[0];
  const worstPattern = patternStats[patternStats.length - 1];

  const confluenceNameById = Object.fromEntries(confluencesList.map((c) => [c.id, c.name]));
  const tradeConfluenceMap = {}; // trade_id -> sorted, deduped confluence_id[]
  tradeConfluenceLinks.forEach((l) => {
    if (!tradeConfluenceMap[l.trade_id]) tradeConfluenceMap[l.trade_id] = [];
    tradeConfluenceMap[l.trade_id].push(l.confluence_id);
  });
  // A trade can carry the same confluence twice (different timeframes) — for
  // pattern matching, what matters is which confluences were present, not
  // how many times each was tagged, so dedupe before comparing sets.
  Object.keys(tradeConfluenceMap).forEach((k) => {
    tradeConfluenceMap[k] = Array.from(new Set(tradeConfluenceMap[k])).sort();
  });
  const patternConfluenceMap = {}; // pattern_id -> sorted confluence_id[]
  patternConfluenceLinks.forEach((l) => {
    if (!patternConfluenceMap[l.pattern_id]) patternConfluenceMap[l.pattern_id] = [];
    patternConfluenceMap[l.pattern_id].push(l.confluence_id);
  });
  Object.values(patternConfluenceMap).forEach((arr) => arr.sort());
  function sameIds(a, b) {
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  const patternPerf = patternsList.map((p) => {
    const confIds = patternConfluenceMap[p.id] || [];
    const label = confIds.length ? confIds.map((id) => confluenceNameById[id] || "?").join(" + ") : "—";
    const taggedTrades = tradingOnly.filter((t) => sameIds(tradeConfluenceMap[t.id] || [], confIds));
    const count = taggedTrades.length;
    const total = taggedTrades.reduce((s, t) => s + t.pnl, 0);
    const wins = taggedTrades.filter((t) => t.pnl > 0).length;
    const winRateP = count ? Math.round((wins / count) * 100) : 0;
    const biggestWin = count ? Math.max(...taggedTrades.map((t) => t.pnl)) : null;
    const biggestLoss = count ? Math.min(...taggedTrades.map((t) => t.pnl)) : null;
    return { id: p.id, label, grade: p.grade, count, total, winRateP, biggestWin, biggestLoss };
  });
  const ratedPatternPerf = patternPerf.filter((p) => p.count > 0);
  const bestConfluencePattern = ratedPatternPerf.length
    ? [...ratedPatternPerf].sort((a, b) => b.total - a.total)[0]
    : null;

  // ---- Calendar: group trades by date, build week rows with a trailing Total column ----
  const dayMap = trades.reduce((acc, t) => {
    if (!acc[t.date]) acc[t.date] = { total: 0, count: 0, wins: 0, payoutTotal: 0 };
    if (t.entryType === "payout") {
      acc[t.date].payoutTotal += t.pnl;
    } else {
      acc[t.date].total += t.pnl;
      acc[t.date].count += 1;
      if (t.pnl > 0) acc[t.date].wins += 1;
    }
    return acc;
  }, {});

  function pad2(n) { return String(n).padStart(2, "0"); }
  function buildCalendarWeeks(year, month) {
    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startWeekday = firstOfMonth.getDay(); // 0 = Sun
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
      cells.push({ day: d, dateStr, data: dayMap[dateStr] || null });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) {
      const weekCells = cells.slice(i, i + 7);
      const weekTotal = weekCells.reduce((s, c) => s + (c && c.data ? c.data.total : 0), 0);
      const weekPayoutTotal = weekCells.reduce((s, c) => s + (c && c.data ? c.data.payoutTotal : 0), 0);
      const weekTradeCount = weekCells.reduce((s, c) => s + (c && c.data ? c.data.count : 0), 0);
      weeks.push({ cells: weekCells, total: weekTotal, payoutTotal: weekPayoutTotal, tradeCount: weekTradeCount });
    }
    return weeks;
  }
  const calendarWeeks = buildCalendarWeeks(calYear, calMonth);
  const firstEntryDate = trades.length ? [...trades].sort((a, b) => (a.date < b.date ? -1 : 1))[0].date : null;
  const firstEntryYear = firstEntryDate ? Number(firstEntryDate.slice(0, 4)) : null;
  const firstEntryMonth = firstEntryDate ? Number(firstEntryDate.slice(5, 7)) - 1 : null;
  const atEarliestMonth = firstEntryDate !== null && (calYear < firstEntryYear || (calYear === firstEntryYear && calMonth <= firstEntryMonth));
  const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const WEEKDAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri"];

  // ---- Account size: running balance starting at 0, one point per calendar day (evenly spaced) ----
  function nextDay(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function prevDay(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function applyQuickRange(preset) {
    setQuickRange(preset);
    if (!preset) return;
    const end = new Date();
    const start = new Date();
    if (preset === "1d") start.setDate(end.getDate() - 1);
    else if (preset === "1w") start.setDate(end.getDate() - 7);
    else if (preset === "1m") start.setMonth(end.getMonth() - 1);
    else if (preset === "6m") start.setMonth(end.getMonth() - 6);
    else if (preset === "1y") start.setFullYear(end.getFullYear() - 1);
    const fmtLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    setPerfRangeStart(fmtLocal(start));
    setPerfRangeEnd(fmtLocal(end));
  }
  const chronoTradesAll = [...trades].sort((a, b) => (a.date > b.date ? 1 : a.date < b.date ? -1 : 0));
  const chronoTrades = chronoTradesAll.filter((t) => {
    if (perfRangeStart && t.date < perfRangeStart) return false;
    if (perfRangeEnd && t.date > perfRangeEnd) return false;
    return true;
  });
  const dayStart = perfRangeStart || (chronoTrades[0] ? chronoTrades[0].date : null);
  const dayEnd = perfRangeEnd || (chronoTrades.length ? chronoTrades[chronoTrades.length - 1].date : null);
  const maxLossNumForCurve = targets.maxLoss === "" ? null : Number(targets.maxLoss);
  function isWeekend(dateStr) {
    const wd = new Date(dateStr + "T00:00:00").getDay();
    return wd === 0 || wd === 6;
  }
  const equityCurve = [];
  if (dayStart && dayEnd) {
    const dayPnl = {};
    chronoTrades.forEach((t) => { dayPnl[t.date] = (dayPnl[t.date] || 0) + t.pnl; });
    equityCurve.push({ date: prevDay(dayStart), balance: 0, minBalance: null });
    let running = 0;
    let peakToDate = 0;
    let cur = dayStart;
    let guard = 0;
    while (cur <= dayEnd && guard < 5000) {
      running += dayPnl[cur] || 0;
      peakToDate = Math.max(peakToDate, running);
      if (!isWeekend(cur) || dayPnl[cur] !== undefined) {
        const minBalance = maxLossNumForCurve !== null ? peakToDate - Math.abs(maxLossNumForCurve) : null;
        equityCurve.push({ date: cur, balance: running, minBalance });
      }
      if (cur === dayEnd) break;
      cur = nextDay(cur);
      guard++;
    }
  }
  const currentBalance = equityCurve.length ? equityCurve[equityCurve.length - 1].balance : 0;
  const peakBalance = Math.max(0, ...equityCurve.map((p) => p.balance));
  const troughBalance = Math.min(0, ...equityCurve.map((p) => p.balance));
  const drawdownRecovered = currentBalance > Math.abs(troughBalance);
  const displayDrawdown = drawdownRecovered ? 0 : troughBalance;

  const maxLossNum = targets.maxLoss === "" ? null : Number(targets.maxLoss);
  // Minimum Balance floor: always trails the peak by the Max Loss amount (e.g. max loss $2,000,
  // peak +$2,500 -> minimum balance $500). Ratchets up automatically as the peak grows.
  const maxLossLevel = maxLossNum !== null ? peakBalance - Math.abs(maxLossNum) : null;
  const profitTargetHit = profitTargetNum !== null && currentBalance >= profitTargetNum;
  const maxLossHit = maxLossLevel !== null && currentBalance <= maxLossLevel;

      {/* Main content */}
      <div className="main-content" style={{ flex: 1, padding: "28px 32px 60px", width: "100%" }}>
        <header style={{ marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
          <div>
            <h1 style={{ fontSize: 24, margin: 0, fontWeight: 700, letterSpacing: "-0.01em" }}>
              {tab === "dashboard" ? "Dashboard" : tab === "trades" ? "Trades" : tab === "calendar" ? "Performance" : tab === "patterns" ? "Patterns" : tab === "friends" ? "Friends" : "Journal"}
            </h1>
            <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 2 }}>
              {tab === "dashboard" ? "Your performance and your friends'" : tab === "trades" ? "Log and review every trade" : tab === "calendar" ? "Account growth and daily/weekly P&L" : tab === "patterns" ? "How you perform by how you felt" : tab === "friends" ? "See each other's trades" : "Track how you felt and why"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={exportData} style={ghostBtnStyle_()}>Export</button>
            <label style={{ ...ghostBtnStyle_(), cursor: "pointer" }}>
              Import
              <input type="file" accept="application/json" onChange={importData} style={{ display: "none" }} />
            </label>

        {saveError && (
          <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "10px 14px", borderRadius: 10, fontSize: 13, marginBottom: 18 }}>

        {tab === "dashboard" ? (

            <div className="stats-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 12 }}>

              <StatCard label="Your total P&L" value={fmtMoney(totalPnl)} color={totalPnl >= 0 ? COLORS.win : COLORS.loss} />

            </div>

              <StatCard label="Best pattern" value={bestConfluencePattern ? bestConfluencePattern.label : "—"} color={bestConfluencePattern ? COLORS.win : undefined} />
            </div>

            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Friends</div>
            {acceptedFriends.length === 0 ? (

                {acceptedFriends.map((f) => {

                  return (
                    <div key={f.id} style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap", boxShadow: "0 1px 2px rgba(23,21,51,0.04)" }}>

                      {stats ? (

                          <span>Total P&L: <span style={{ fontWeight: 700, color: stats.totalPnl >= 0 ? COLORS.win : COLORS.loss }}>{fmtMoney(stats.totalPnl)}</span></span>
                          <span>Win rate: <span style={{ fontWeight: 700 }}>{stats.winRate}%</span></span>
                          <span style={{ color: COLORS.textMuted }}>{stats.tradeCount} trade{stats.tradeCount === 1 ? "" : "s"}</span>
                          <button onClick={() => openFriendPerformance(f)} style={{ ...ghostBtnStyle_(), fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" }}>View performance</button>

        ) : tab === "trades" ? (

                {[{ v: "trade", label: "Trade" }, { v: "payout", label: "Payouts" }].map((opt) => (

                          <span style={{ fontSize: 11, fontWeight: 700, padding: "1px 8px", borderRadius: 6, color: t.side === "short" ? COLORS.loss : COLORS.win, background: t.side === "short" ? COLORS.lossSoft : COLORS.winSoft }}>
                            {t.side === "short" ? "SHORT" : "LONG"}
                          </span>
                        </div>
                        <span className="mono" style={{ fontWeight: 700, fontSize: 14, color: pnlColor(t) }}>{fmtMoney(t.pnl)}</span>
                      </div>
                      <div className="mono" style={{ fontSize: 11.5, color: COLORS.textMuted, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
                        <span>{fmtDuration(t.duration)}</span>
                        {t.risk !== null && t.risk !== undefined && <span>Risk {t.risk}%</span>}
                        {t.rr !== null && t.rr !== undefined && <span>{t.rr}R</span>}
                        {t.grade && (
                          <span style={{ color: gradeColor(t.grade), background: gradeColor(t.grade) + "18", border: `1px solid ${gradeColor(t.grade)}40`, borderRadius: 6, padding: "1px 7px", fontWeight: 700 }}>
                            {t.grade}
                          </span>
                        )}
                        <button
                          onClick={() => setMediaModalTradeId(t.id)}
                          style={{
                            display: "inline-flex", alignItems: "center", gap: 4,
                            background: (t.media || []).length ? COLORS.accentSoft : "transparent",
                            border: `1px solid ${(t.media || []).length ? COLORS.accent + "33" : COLORS.border}`,
                            color: (t.media || []).length ? COLORS.accent : COLORS.textMuted,
                            borderRadius: 20, padding: "2px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer",
                          }}
                        >
                          📎 {(t.media || []).length || "Add"}
                        </button>
                      </div>
                      {linkedEntries.length > 0 && (
                        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 4 }}>
                          {linkedEntries.map((en) => {
                            const mi = moodInfo(en.mood);
                            return (
                              <div key={en.id} style={{ fontSize: 11.5, color: COLORS.accent, display: "flex", alignItems: "center", gap: 6 }}>
                                <span>🔗</span>
                                <span style={{ color: mi.color, fontWeight: 600 }}>{mi.label}</span>
                                {(en.feelingDetail || en.notes) && <span style={{ color: COLORS.textMuted }}>— {(en.feelingDetail || en.notes).slice(0, 60)}{(en.feelingDetail || en.notes).length > 60 ? "…" : ""}</span>}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {dayEntries.length > 0 && (
                <>
                  <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.textMuted, marginBottom: 8 }}>JOURNAL ENTRIES ({dayEntries.length})</div>
                  <div style={{ display: "grid", gap: 8 }}>
                    {dayEntries.map((en) => {
                      const mi = moodInfo(en.mood);
                      return (
                        <div key={en.id} style={{ border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 12 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                            <span style={{ fontSize: 11, color: mi.color, border: `1px solid ${mi.color}33`, background: mi.color + "14", padding: "2px 9px", borderRadius: 20, fontWeight: 600 }}>
                              {mi.label}
                            </span>
                          </div>
                          {en.feelingDetail && <div style={{ fontSize: 13.5, marginBottom: 4 }}>{en.feelingDetail}</div>}
                          {en.conditions && <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 4 }}><span style={{ fontWeight: 600, color: COLORS.text }}>Market: </span>{en.conditions}</div>}
                          {en.notes && <div style={{ fontSize: 13.5 }}>{en.notes}</div>}
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          </div>
        );
      })()}

      {editingTradeId && editForm && (
        <div onClick={() => { setEditingTradeId(null); setEditForm(null); }} style={{ position: "fixed", inset: 0, background: "rgba(20,20,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 58 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 16, padding: 24, width: "100%", maxWidth: 480, boxShadow: "0 20px 60px rgba(20,20,35,0.35)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700 }}>Edit trade</div>
              <button onClick={() => { setEditingTradeId(null); setEditForm(null); }} style={deleteBtnStyle_()} aria-label="Close">✕</button>
            </div>
            <div style={{ display: "grid", gap: 12 }}>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <Field label="Date" style={{ flex: "1 1 140px" }}>
                  <input type="date" value={editForm.date} onChange={(e) => setEditForm({ ...editForm, date: e.target.value })} style={inputStyle_()} />
                </Field>
                <Field label="Symbol" style={{ flex: "1 1 100px" }}>
                  <input type="text" value={editForm.symbol} onChange={(e) => setEditForm({ ...editForm, symbol: e.target.value })} style={inputStyle_()} />
                </Field>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <Field label="Side" style={{ flex: "1 1 90px" }}>
                  <select value={editForm.side} onChange={(e) => setEditForm({ ...editForm, side: e.target.value })} style={inputStyle_()}>
                    <option value="long">Long</option>
                    <option value="short">Short</option>
                  </select>
                </Field>
                <Field label="P&L ($)" style={{ flex: "1 1 110px" }}>
                  <input type="number" step="0.01" value={editForm.pnl} onChange={(e) => setEditForm({ ...editForm, pnl: e.target.value })} style={inputStyle_()} className="mono" />
                </Field>
                <Field label="Duration" style={{ flex: "1 1 200px" }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <input type="number" min="0" value={editForm.durationH} onChange={(e) => setEditForm({ ...editForm, durationH: e.target.value })} placeholder="0h" style={inputStyle_()} className="mono" />
                    <input type="number" min="0" value={editForm.durationM} onChange={(e) => setEditForm({ ...editForm, durationM: e.target.value })} placeholder="0m" style={inputStyle_()} className="mono" />
                    <input type="number" min="0" value={editForm.durationS} onChange={(e) => setEditForm({ ...editForm, durationS: e.target.value })} placeholder="0s" style={inputStyle_()} className="mono" />
                  </div>
                </Field>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <Field label="Risk (%)" style={{ flex: "1 1 90px" }}>
                  <input type="number" step="0.1" min="0" value={editForm.risk} onChange={(e) => setEditForm({ ...editForm, risk: e.target.value })} style={inputStyle_()} className="mono" />
                </Field>
                <Field label="R:R" style={{ flex: "1 1 90px" }}>
                  <input type="number" step="0.01" min="0" value={editForm.rr} onChange={(e) => setEditForm({ ...editForm, rr: e.target.value })} style={inputStyle_()} className="mono" />
                </Field>
                <Field label="Grade" style={{ flex: "1 1 90px" }}>
                  <select value={editForm.grade} onChange={(e) => setEditForm({ ...editForm, grade: e.target.value })} style={inputStyle_()}>
                    <option value="">—</option>
                    {GRADES.slice().reverse().map((g) => <option key={g} value={g}>{g}</option>)}
                  </select>
                </Field>
              </div>
              {editForm.error && (
                <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "8px 12px", borderRadius: 8, fontSize: 13 }}>
                  {editForm.error}
                </div>
              )}
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={saveEditedTrade} style={primaryBtnStyle_()}>Save changes</button>
                <button onClick={() => { setEditingTradeId(null); setEditForm(null); }} style={ghostBtnStyle_()}>Cancel</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {viewTradeId && (() => {
        const t = findTrade(viewTradeId);
        if (!t) return null;
        const tradeConfluenceNames = tradeConfluenceLinks
          .filter((l) => l.trade_id === t.id)
          .map((l) => {
            const conf = confluencesList.find((c) => c.id === l.confluence_id);
            if (!conf) return null;
            const tfLabel = l.timeframe ? TIMEFRAME_LABEL[l.timeframe] || l.timeframe : null;
            return tfLabel ? `${conf.name} (${tfLabel})` : conf.name;
          })
          .filter(Boolean);
        const tradeTargetTagNames = tradeTargetTagLinks
          .filter((l) => l.trade_id === t.id)
          .map((l) => { const tg = targetTagsList.find((x) => x.id === l.target_tag_id); return tg ? tg.name : null; })
          .filter(Boolean);
        const fields = [
          { label: "Date", value: t.date },
          { label: "Symbol", value: t.symbol || "—" },
          { label: "Side", value: t.side === "short" ? "Short" : "Long" },
          { label: "P&L", value: fmtMoney(t.pnl), color: pnlColor(t) },
          { label: "Duration", value: fmtDuration(t.duration) },
          { label: "Risk", value: t.risk !== null && t.risk !== undefined ? `${t.risk}%` : "—" },
          { label: "R:R", value: t.rr !== null && t.rr !== undefined ? `${t.rr}R` : "—" },
          { label: "Grade", value: t.grade || "—", color: t.grade ? gradeColor(t.grade) : null },
          { label: "Confluences", value: tradeConfluenceNames.length ? tradeConfluenceNames.join(", ") : "—" },
          { label: "Targets", value: tradeTargetTagNames.length ? tradeTargetTagNames.join(", ") : "—" },
        ];
        return (
          <div onClick={() => setViewTradeId(null)} style={{ position: "fixed", inset: 0, background: "rgba(20,20,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 55 }}>
            <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 16, padding: 24, width: "100%", maxWidth: 460, boxShadow: "0 20px 60px rgba(20,20,35,0.35)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
                <div>
                  <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 2 }}>TRADE #{tradeNumberMap.get(t.id)}</div>
                  <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: pnlColor(t) }}>{fmtMoney(t.pnl)}</div>
                </div>
                <button onClick={() => setViewTradeId(null)} style={deleteBtnStyle_()} aria-label="Close">✕</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 18 }}>
                {fields.map((f) => (
                  <div key={f.label}>
                    <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, marginBottom: 3 }}>{f.label.toUpperCase()}</div>
                    <div className="mono" style={{ fontSize: 14, fontWeight: 700, color: f.color || COLORS.text }}>{f.value}</div>
                  </div>
                ))}
              </div>
              <button
                onClick={() => { setViewTradeId(null); setMediaModalTradeId(t.id); }}
                style={{ ...ghostBtnStyle_(), width: "100%" }}
              >
                📎 {(t.media || []).length ? `View ${(t.media || []).length} attachment${(t.media || []).length === 1 ? "" : "s"}` : "Add photos/videos"}
              </button>
            </div>
          </div>
        );
      })()}

      {mediaModalTradeId && (() => {
        const t = findTrade(mediaModalTradeId);
        if (!t) return null;
        return (
          <TradeMediaModal
            trade={t}
            onClose={() => setMediaModalTradeId(null)}
            onAddFiles={addMediaFiles}
            onDeleteMedia={deleteMediaItem}
          />
        );
      })()}

      {viewingFriend && (() => {
        const tradingOnlyF = friendTrades.filter((t) => t.entryType !== "payout");
        const totalPnlF = tradingOnlyF.reduce((s, t) => s + t.pnl, 0);
        const winsF = tradingOnlyF.filter((t) => t.pnl > 0).length;
        const winRateF = tradingOnlyF.length ? Math.round((winsF / tradingOnlyF.length) * 100) : 0;
        const grossWinF = tradingOnlyF.filter((t) => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
        const grossLossF = Math.abs(tradingOnlyF.filter((t) => t.pnl < 0).reduce((s, t) => s + t.pnl, 0));
        const profitFactorF = grossLossF > 0 ? (grossWinF / grossLossF) : (grossWinF > 0 ? Infinity : 0);
        const avgDurationF = tradingOnlyF.length ? Math.round(tradingOnlyF.reduce((s, t) => s + t.duration, 0) / tradingOnlyF.length) : 0;

        const chronoF = [...friendTrades].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        const dayPnlF = {};
        chronoF.forEach((t) => { dayPnlF[t.date] = (dayPnlF[t.date] || 0) + t.pnl; });
        const equityCurveF = [];
        if (chronoF.length) {
          const startF = chronoF[0].date;
          const endF = chronoF[chronoF.length - 1].date;
          equityCurveF.push({ date: prevDay(startF), balance: 0, minBalance: null });
          let runningF = 0;
          let curF = startF;
          let guardF = 0;
          while (curF <= endF && guardF < 5000) {
            runningF += dayPnlF[curF] || 0;
            if (!isWeekend(curF) || dayPnlF[curF] !== undefined) {
              equityCurveF.push({ date: curF, balance: runningF, minBalance: null });
            }
            if (curF === endF) break;
            curF = nextDay(curF);
            guardF++;
          }
        }

        return (
          <div onClick={closeFriendPerformance} style={{ position: "fixed", inset: 0, background: "rgba(20,20,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 60 }}>
            <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 16, padding: 24, width: "100%", maxWidth: 760, maxHeight: "86vh", overflowY: "auto", boxShadow: "0 20px 60px rgba(20,20,35,0.35)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{viewingFriend.label}'s performance</div>
                <button onClick={closeFriendPerformance} style={deleteBtnStyle_()} aria-label="Close">✕</button>
              </div>
              {friendTradesLoading ? (
                <div style={{ color: COLORS.textMuted, fontSize: 13, textAlign: "center", padding: "30px 0" }}>Loading…</div>
              ) : friendTradesError ? (
                <div style={{ background: COLORS.lossSoft, border: `1px solid ${COLORS.loss}33`, color: COLORS.loss, padding: "10px 14px", borderRadius: 10, fontSize: 13 }}>{friendTradesError}</div>
              ) : tradingOnlyF.length === 0 ? (
                <EmptyState text="This friend hasn't logged any trades yet." />
              ) : (
                <>
                  <div className="stats-grid" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
                    <StatCard label="Total P&L" value={fmtMoney(totalPnlF)} color={totalPnlF >= 0 ? COLORS.win : COLORS.loss} />
                    <StatCard label="Win rate" value={`${winRateF}%`} />
                    <StatCard label="Profit factor" value={profitFactorF === Infinity ? "∞" : profitFactorF.toFixed(2)} />
                    <StatCard label="Avg duration" value={fmtDuration(avgDurationF)} />
                  </div>
                  <EquityChart points={equityCurveF} height={260} />
                </>
              )}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ---- Top-level app: session check -> auth gate -> subscription gate -> the journal ----
function App() {
  const [theme] = useState(() => loadLocal(THEME_KEY, "light"));
  applyTheme(theme); // so the auth/paywall screens respect the stored theme too

  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [profile, setProfile] = useState(null);
  const [profileLoading, setProfileLoading] = useState(true);
  const [checkoutBusy, setCheckoutBusy] = useState(false);
  const [checkoutError, setCheckoutError] = useState(null);
  const [activating, setActivating] = useState(() => new URLSearchParams(window.location.search).get("checkout") === "success");

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => authListener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); setProfileLoading(false); return; }
    let cancelled = false;
    let attempts = 0;
    setProfileLoading(true);

    async function fetchProfile() {
      attempts += 1;
      const { data, error } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (!error && data) {
        setProfile(data);
        setProfileLoading(false);
        return;
      }
      // The profile row is created by a DB trigger right after signup — on the
      // very first login it can occasionally lag by a moment.
      if (attempts < 5) {
        setTimeout(fetchProfile, 800);
      } else {
        setProfileLoading(false);
      }
    }
    fetchProfile();
    return () => { cancelled = true; };
  }, [session && session.user.id]);

  // Poll briefly after a Stripe Checkout redirect for the webhook to flip the status to active.
  useEffect(() => {
    if (!activating || !session) return;
    let cancelled = false;
    let attempts = 0;
    const interval = setInterval(async () => {
      attempts += 1;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (data) setProfile(data);
      if ((data && data.subscription_status === "active") || attempts >= 10) {
        clearInterval(interval);
        setActivating(false);
        const url = new URL(window.location.href);
        url.searchParams.delete("checkout");
        window.history.replaceState({}, "", url.toString());
      }
    }, 2000);
    return () => { cancelled = true; clearInterval(interval); };
  }, [activating, session && session.user.id]);

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  async function handleSubscribe() {
    setCheckoutBusy(true);
    setCheckoutError(null);
    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const token = sessionData.session && sessionData.session.access_token;
      const res = await fetch("/api/create-checkout-session", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
      });
      const body = await res.json();
      if (!res.ok || !body.url) throw new Error(body.error || "Could not start checkout.");
      window.location.href = body.url;
    } catch (err) {
      setCheckoutError(err.message || "Could not start checkout.");
      setCheckoutBusy(false);
    }
  }

  const loadingScreen = (text) => (
    <div style={{ display: "flex", minHeight: "100vh", alignItems: "center", justifyContent: "center", background: COLORS.bg, color: COLORS.textMuted, fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" }}>
      {text}
    </div>
  );

  if (session === undefined) return loadingScreen("Loading…");
  if (session === null) return <AuthScreen />;
  if (profileLoading) return loadingScreen("Setting up your account…");
  if (activating) return loadingScreen("Activating your account…");

  const status = profile ? profile.subscription_status : "trialing";
  const nowMs = Date.now();
  const createdAtMs = profile ? new Date(profile.created_at).getTime() : nowMs;
  const trialEndMs = createdAtMs + 7 * 24 * 60 * 60 * 1000;
  const periodEndMs = profile && profile.current_period_end ? new Date(profile.current_period_end).getTime() : null;
  const graceMs = 3 * 24 * 60 * 60 * 1000;
  const allowed =
    status === "active" ||
    (status === "trialing" && nowMs < trialEndMs) ||
    (status === "past_due" && periodEndMs !== null && nowMs < periodEndMs + graceMs);

  if (!allowed) {
    return (
      <Paywall
        status={status}
        onLogout={handleLogout}
        onSubscribe={handleSubscribe}
        checkoutBusy={checkoutBusy}
        checkoutError={checkoutError}
      />
    );
  }

  return <TradeJournal session={session} onLogout={handleLogout} initialDisplayName={profile ? profile.display_name : ""} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
